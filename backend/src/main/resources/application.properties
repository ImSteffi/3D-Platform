spring.application.name=backend
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${DATABASE_ADMIN_USERNAME}
spring.flyway.password=${DATABASE_ADMIN_PASSWORD}

storage.r2.endpoint=${R2_ENDPOINT}
storage.r2.bucket-name=${R2_BUCKET_NAME}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
spring.mvc.async.request-timeout=30m

app.public-origin=${PUBLIC_ORIGIN:}

# Session cookie: not readable by scripts, not sent from other sites, HTTPS only.
# Browsers allow Secure cookies on http://localhost, so local development keeps working.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Behind the production proxy: trust its X-Forwarded-* headers for HTTPS and the client address.
server.forward-headers-strategy=framework
