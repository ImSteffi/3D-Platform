spring.application.name=backend
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${DATABASE_ADMIN_USERNAME}
spring.flyway.password=${DATABASE_ADMIN_PASSWORD}

storage.r2.endpoint=${R2_ENDPOINT}
storage.r2.bucket-name=${R2_BUCKET_NAME}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}